site_name: Jon Wakefield
site_description: Faculty page of Jonathan Wakefield, Professor of Statistics and Biostatistics, University of Washington.
site_author: Jon Wakefield
site_url: https://example.com/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Research: research.md
  - People: people.md
  - Software: software.md
  - Teaching: teaching.md
  - Impact: spatial-demography.md
  - Personal: personal.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
    - icon: fontawesome/solid/graduation-cap
      link: https://scholar.google.com/citations?user=mYyRi8sAAAAJ&hl=en
